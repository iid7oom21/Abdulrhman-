name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history for credentials
        env:
          SCANNER: zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 # v8.24.3
        run: |
          status=0
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$SCANNER" git --redact --no-banner --log-opts='--all -m' --exit-code=42 . || status=$?
          if [ "$status" -eq 42 ]; then
            echo '::warning::Possible credential in Git history. Review privately and rotate any exposed key.'
          fi
          exit "$status"
